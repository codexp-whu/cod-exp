{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  {% set visit_label = 'visits' if config.theme.language == 'en' else '次访问' %}
  {% set visitor_label = 'visitors' if config.theme.language == 'en' else '位访客' %}

  <!-- Busuanzi 访问统计 -->
  <script async
      src="https://busuanzi.aspark.cc/js"
      data-prefix="busuanzi"
      data-style="comma"
      pjax></script>

  <script>
    window.__i18n_labels__ = {
      visit: "{{ visit_label }}",
      visitor: "{{ visitor_label }}"
    };

    (function () {
      function initSiteStats() {
        if (document.querySelector('.site-stats')) return;

        var header = document.querySelector('.md-header__inner');
        if (!header) return;

        var stats = document.createElement('div');
        stats.className = 'site-stats';

        stats.innerHTML =
          '<span class="site-stat">' +
            '<span class="site-stat-icon">◉</span>' +
            '<span id="busuanzi_site_pv">--</span>' +
            '<span>' + window.__i18n_labels__.visit + '</span>' +
          '</span>' +
          '<span class="site-stat-divider"></span>' +
          '<span class="site-stat">' +
            '<span class="site-stat-icon">◉</span>' +
            '<span id="busuanzi_site_uv">--</span>' +
            '<span>' + window.__i18n_labels__.visitor + '</span>' +
          '</span>';

        header.appendChild(stats);
      }

      function boot() {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initSiteStats);
        } else {
          initSiteStats();
        }
      }

      boot();

      if (typeof document$ !== 'undefined' && document$.subscribe) {
        document$.subscribe(function () {
          initSiteStats();
        });
      }
    })();
  </script>
{% endblock %}
