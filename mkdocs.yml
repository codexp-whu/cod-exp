site_name: 武汉大学2026年秋计算机组成与体系结构A
site_url: https://mydomain.org/mysite
site_description: 武汉大学计算机学院《计算机组成与体系结构A》课程讲义与实验指导
site_author: 课程教学组
copyright: Copyright &copy; 2026 武汉大学计算机学院

theme:
  name: material
  language: zh
  features:
    - navigation.tabs          # 顶层标签导航
    - navigation.top           # 返回顶部按钮
    - navigation.sections      # 导航按节折叠
    - navigation.footer        # 页脚导航（上一页/下一页）
    - content.code.annotate    # 代码块注释支持
    - content.code.copy        # 代码复制按钮
    - content.code.highlight   # 代码高亮
    - content.code.tabbed      # 代码选项卡样式
    - content.tabs.link        # 跨页标签同步
    - navigation.indexes       # 为每个节启用索引页
    - search.suggest           # 搜索建议
    - search.highlight         # 搜索高亮
    - search.share             # 搜索分享
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono

# 导航结构（课程讲义大纲）
nav:
  - 首页: 
    - 计算机组成与体系结构实验: index.md
  - 实验准备:
    - 介绍: pre/介绍.md
    - 实验模板: pre/实验模板.md
  - 数字电路基础:
      - 栏目简介: labs/01-数字电路基础/index.md
      - 实验1：跑马灯: labs/01-数字电路基础/实验1-跑马灯.md
      - 实验2：寄存器堆仿真: labs/01-数字电路基础/实验2-寄存器堆仿真.md
      - 实验3：同步RAM和异步RAM: labs/01-数字电路基础/实验3-同步RAM和异步RAM.md
      - 实验4：数字逻辑电路设计与调试: labs/01-数字电路基础/实验4-数字逻辑电路设计与调试.md

  - 单周期CPU设计:
